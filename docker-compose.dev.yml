# =============================================================================
# !! LOCAL DEV FIXTURES ONLY — DO NOT USE IN PRODUCTION !!
# -----------------------------------------------------------------------------
# Every credential in this file is a weak, hardcoded DEV FIXTURE: the Zitadel
# --masterkey ("MasterkeyNeedsToHave32Characters"), the Postgres user/admin
# passwords ("zitadel"/"postgres"), and the first-instance admin login
# ("admin" / "Password1!"). They exist solely so this stack starts with zero
# setup on a developer laptop.
#
# These values are PUBLIC (committed to the repo) and MUST NEVER be used in any
# shared, staging, or production environment. Production deployments MUST supply
# strong, unique secrets injected via a secrets manager / environment (never
# committed): a freshly-generated 32-char Zitadel masterkey, unique DB
# passwords, and a strong first-instance admin password.
#
# Do not change the values below — the dev stack depends on them.
# =============================================================================
#
# Dev-only fixture: a local Zitadel IdP for OIDC development and the Task 1
# spike. NOT for production. Start with:
#   docker compose -f docker-compose.dev.yml up -d
# Console: http://localhost:8082/ui/console  (admin / Password1!)
services:
  zitadel:
    # Pinned to v2.71.0 (last v2 release): bundles Console + Login UI (v1) in a
    # single container. v3/v4 :latest split the login UI into a SEPARATE
    # login-v2 container, so /ui/v2/login/* 404s and the console can't complete
    # a login flow (the {"code":5,"message":"Not Found"} the human hit).
    image: ghcr.io/zitadel/zitadel:v2.71.0
    command: 'start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled'
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8082
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Password1!
    ports:
      - "8082:8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
  zitadel-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
