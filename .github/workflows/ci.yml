# CI for the Gig'MCP gateway (Go), dashboard (Next.js), and Docker images.
#
# Layout note: go.mod contains
#   replace github.com/gigmcp/registry/schema => ../gigmcp-registry/schema
# so every Go/Docker job checks out THIS repo into ./gigmcp and the public
# gigmcp/registry repo into ./gigmcp-registry (siblings inside the workspace),
# then runs with working-directory: gigmcp.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout gigmcp
        uses: actions/checkout@v6
        with:
          path: gigmcp
      - name: Checkout gigmcp/registry (go.mod replace sibling)
        uses: actions/checkout@v6
        with:
          repository: gigmcp/registry
          path: gigmcp-registry
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: gigmcp/go.mod
          cache-dependency-path: gigmcp/go.sum
      # Sandbox/e2e tests gate on sandbox.Available() == linux && bwrap on
      # PATH. They need NET_ADMIN/root privileges the runner user does not
      # have, so if the image ever ships bubblewrap they would FAIL instead of
      # skip. Remove it here so they skip deterministically; the e2e job runs
      # them inside Docker with the required privileges.
      - name: Ensure bwrap absent so privileged sandbox tests self-skip
        run: |
          if command -v bwrap >/dev/null 2>&1; then
            sudo apt-get remove -y bubblewrap
          fi
      - name: gofmt
        working-directory: gigmcp
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "gofmt needed on:" >&2
            echo "$files" >&2
            exit 1
          fi
      - name: go vet
        working-directory: gigmcp
        run: go vet ./...
      - name: go build
        working-directory: gigmcp
        run: go build ./...
      - name: go test
        working-directory: gigmcp
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json # reads "packageManager" for the version
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit
      - name: Lint
        working-directory: web
        run: pnpm run lint
      - name: Build
        working-directory: web
        env:
          # Build-time only: next.config.ts bakes this into the /api and /mcp
          # rewrites. Any syntactically valid URL works for a CI smoke build —
          # nothing is contacted during `next build`.
          GATEWAY_INTERNAL_URL: http://gateway.invalid:8080
        run: pnpm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout gigmcp
        uses: actions/checkout@v6
        with:
          path: gigmcp
      - name: Checkout gigmcp/registry (named build context)
        uses: actions/checkout@v6
        with:
          repository: gigmcp/registry
          path: gigmcp-registry
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      # Build-only smoke test (no push). The Dockerfile does
      # `COPY --from=registry schema/ ...`; docker-compose.yml maps that named
      # context via `additional_contexts: { registry: ../gigmcp-registry }`,
      # replicated here with --build-context.
      - name: Build gateway image
        run: docker buildx build --build-context registry=./gigmcp-registry ./gigmcp
      - name: Build web image
        # GATEWAY_INTERNAL_URL build arg has an in-Dockerfile default; set it
        # explicitly anyway so the smoke build is self-describing.
        run: docker buildx build --build-arg GATEWAY_INTERNAL_URL=http://gateway.invalid:8080 ./gigmcp/web

  # Full sandbox suite (bwrap + veth/NET_ADMIN + seccomp tests) via `make test`,
  # which runs go test inside a Docker container with seccomp/apparmor
  # unconfined and NET_ADMIN — same as local dev.
  #
  # BLOCKING: a hosted-runner run (30c7d32) proved the full sandbox suite
  # executes after the sysctl relaxation below, so failures here are real.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout gigmcp
        uses: actions/checkout@v6
        with:
          path: gigmcp
      - name: Checkout gigmcp/registry (mounted by make test)
        uses: actions/checkout@v6
        with:
          repository: gigmcp/registry
          path: gigmcp-registry
      # Ubuntu 24.04 restricts unprivileged user namespaces by default; relax
      # the sysctls so bwrap inside the unconfined dev container can create
      # them. Best-effort — the job is non-blocking either way.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: make test (full suite in Docker)
        working-directory: gigmcp
        run: make test
